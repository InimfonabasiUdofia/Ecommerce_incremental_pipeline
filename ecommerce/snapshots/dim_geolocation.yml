snapshots:
  - name: dim_geolocation
    relation: ref('dim_geolocation')
    config:
      schema: gold
      database: ecommerce
      unique_key: geolocation_surrogate_key
      strategy: timestamp
      updated_at: geolocation_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.