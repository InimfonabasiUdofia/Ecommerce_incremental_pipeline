snapshots:
  - name: dim_customers
    relation: ref('dim_customer')
    config:
      schema: gold
      database: ecommerce
      unique_key: customer_surrogate_key
      strategy: timestamp
      updated_at: customer_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.