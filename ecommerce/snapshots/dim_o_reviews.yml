snapshots:
  - name: dim_o_reviews
    relation: ref('dim_o_reviews')
    config:
      schema: gold
      database: ecommerce
      unique_key: review_surrogate_key
      strategy: timestamp
      updated_at: review_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.