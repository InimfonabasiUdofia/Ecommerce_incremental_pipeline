snapshots:
  - name: dim_product
    relation: ref('dim_product')
    config:
      schema: gold
      database: ecommerce
      unique_key: product_surrogate_key
      strategy: timestamp
      updated_at: product_updated_timestamp
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.